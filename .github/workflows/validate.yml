name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
      - name: Check formatting
        run: |
          files=$(gofmt -l cmd internal tools api)
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - name: Validate OpenAPI document and examples
        run: go run github.com/getkin/kin-openapi/cmd/validate@v0.133.0 -- api/openapi.json
      - name: Check generated API types
        run: |
          go generate ./api
          git diff --exit-code -- internal/adapters/inbound/openai/types.gen.go
      - run: go vet ./...
      - run: go test ./...
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race -p 1 ./...
      - run: go build ./...

  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  spring-ai-acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
          cache-dependency-path: examples/spring-ai/pom.xml
      - name: Run Spring Boot acceptance with Go CLI fixtures
        run: go run ./tools/acceptance

  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: tools/browser/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: tools/browser
      - name: Install browser
        # The hosted Ubuntu runner already provides Chromium's shared libraries.
        run: npx playwright install --only-shell chromium
        timeout-minutes: 5
        working-directory: tools/browser
      - name: Test Scalar against Go CLI fixtures
        run: npm test
        working-directory: tools/browser
        timeout-minutes: 3
        env:
          HARNESS_GATEWAY_BROWSER_OUTPUT_DIR: ${{ runner.temp }}/harness-gateway-browser-output
      - name: Save browser test report and screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: scalar-browser-acceptance
          path: ${{ runner.temp }}/harness-gateway-browser-output
          if-no-files-found: ignore
          retention-days: 7
