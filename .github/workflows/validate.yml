name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          files=$(gofmt -l cmd internal tools api/generate.go)
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...

  spring-ai-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
          cache-dependency-path: examples/spring-ai/pom.xml
      - name: Run Spring Boot acceptance with Go CLI fixtures
        run: go run ./tools/acceptance
