name: CLI compatibility canary

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  latest-clis:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      HARNESS_GATEWAY_TEST_INSTALLED_CLIS: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
      - name: Install current public CLI packages on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'Harness CLI tools'
          npm.cmd install --global --prefix $prefix '@openai/codex@latest' '@github/copilot@latest'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd list --global --prefix $prefix --depth=0 --json | Out-File -FilePath cli-packages.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $prefix | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install current public CLI packages on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          prefix="$RUNNER_TEMP/Harness CLI tools"
          npm install --global --prefix "$prefix" '@openai/codex@latest' '@github/copilot@latest'
          npm list --global --prefix "$prefix" --depth=0 --json > cli-packages.json
          printf '%s\n' "$prefix/bin" >> "$GITHUB_PATH"
      - name: Test real launchers, handshakes, and isolated session storage
        shell: bash
        run: |
          go test -v -count=1 -timeout=3m -run '^TestInstalledCLI' ./cmd/harness-gateway ./internal/adapters/outbound/codex ./internal/adapters/outbound/copilot 2>&1 | tee installed-clis.log
      - name: Retain resolved versions and test diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: cli-canary-${{ matrix.os }}
          path: |
            cli-packages.json
            installed-clis.log
          if-no-files-found: warn
          retention-days: 14
